name: Build macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: zsh Scripts/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Cinema Player.app" build/Cinema-Player-macOS.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/Cinema-Player-macOS.zip --generate-notes
