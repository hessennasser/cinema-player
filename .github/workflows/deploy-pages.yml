name: Publish project site

on:
  push:
    branches: [main]
    paths: [Website/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Website to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=Website -b publish-site
          git push origin publish-site:gh-pages --force
